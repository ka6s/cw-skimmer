# CW Skimmer Configuration File
# TCI Radio Connection
# Radio is on this machine.
# deskHPSDR: TCI audio_start only, no iq_start
# Thetis / ExpertSDR with IQ: localhost when the radio app is local
radio_host=127.0.0.1
radio_port=50001
radio_protocol=websocket
center_frequency=14074000
sample_rate=48000
# Kept for the log. The IQ dial is the waterfall center minus the picture
# offset. Adding the offset walks the dial down through 14 MHz.
iq_conjugate=1
# Spectrum mode: 0 = full 48 kHz (default), 3000 = ±1.5 kHz experiment
# Tools → Spectrum: Wide 48 kHz  restores the standard waterfall
spectrum_span_hz=0

# Spotting Server Connection (telnet)
spot_server_host=192.168.2.146
spot_server_port=7373
spot_server_callsign=CWSKIMMER

# Detection Parameters
detection_threshold=14
min_snr_db=2
decode_min_snr_db=2
decode_bucket_hz=1000
validation_mode=normal
spot_enabled=0

# One Spectrum decoder per 1 kHz slice. 48 covers the full 48 kHz band.
multi_decode_channels=48

# Offline training streams are chosen in the GUI (Training file…, then Start playback).
# Leave this empty so the Start button connects to the radio.
training_file=

# CW keyboard. tci sends TCI cw_macros (Thetis and deskHPSDR).
# ky sends Kenwood TS-2000 "KY <text>;" on cat_host:cat_port.
# Thetis CAT is its own TCP server. deskHPSDR's built-in TS-2000 port does
# not implement KY; use its rigctld bridge, or leave cw_send=tci.
# cat_port 0 stays on TCI even when cw_send=ky.
# Put the radio in CW first. The keyboard does not change mode.
cw_send=tci
cw_wpm=20
cat_host=127.0.0.1
cat_port=0

# Logging
log_level=1
log_file=cw-skimmer.log
