# CW Skimmer Configuration File
# TCI Radio Connection
# deskHPSDR on this machine: 127.0.0.1  (TCI: audio_start only, no iq_start)
# Thetis / ExpertSDR with IQ: your radio LAN IP
radio_host=192.168.2.146
radio_port=50001
radio_protocol=websocket
center_frequency=14074000
sample_rate=48000
# Spectrum mode: 0 = full 48 kHz (default), 3000 = ±1.5 kHz experiment
# Tools → Spectrum: Wide 48 kHz  restores the standard waterfall
spectrum_span_hz=0

# Spotting Server Connection (telnet)
spot_server_host=192.168.2.146
spot_server_port=7373
spot_server_callsign=CWSKIMMER

# Detection Parameters
detection_threshold=14
min_snr_db=2
decode_min_snr_db=2
decode_bucket_hz=1000
validation_mode=normal
spot_enabled=0

# Parallel CW Decode channels (1…16)
multi_decode_channels=1

# DeepCW neural decoder (from web-deep-cw-decoder / deepcw-engine)
deepcw_model_path=models/model.onnx

# Logging
log_level=1
log_file=cw-skimmer.log
